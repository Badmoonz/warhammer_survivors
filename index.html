<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale1" />
    <title>Fyreslayer: Skaven Tide — survivors-like MVP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #f7c948;
            --gold-dark: #8a6d1f;
            --warp: #4dff88;
            --blood: #c22323;
            --panel: #14100c;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #080504; }
        body { font-family: 'Press Start 2P', 'Courier New', monospace; color: #e8dcc0; }
        #app { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; display: block; }

        #ui { position: absolute; inset: 0; pointer-events: none; }

        /* XP bar */
        #xpbar { position: absolute; top: 0; left: 0; right: 0; height: 16px; background: #0d1a10; border-bottom: 3px solid #000; }
        #xpfill { height: 100%; width: 0%; background: linear-gradient(90deg, #1f9e4d, #4dff88); }

        #topline { position: absolute; top: 24px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 14px; font-size: 9px; color: var(--gold); text-shadow: 2px 2px 0 #000; }
        #timer { font-size: 12px; }

        #stats { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; font-size: 7px; color: #9a8c6a; text-shadow: 1px 1px 0 #000; }

        /* HP bar */
        #hpwrap { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); width: 340px; }
        #hpbar { height: 16px; background: #2a0a0a; border: 3px solid #000; box-shadow: 0 0 0 2px #3a2a1a; }
        #hpfill { height: 100%; width: 100%; background: linear-gradient(90deg, #7c1616, #c22323); }
        #hptext { position: absolute; inset: 0; text-align: center; font-size: 8px; line-height: 16px; color: #fff; text-shadow: 1px 1px 0 #000; }

        /* banner */
        #banner { position: absolute; top: 22%; left: 0; right: 0; text-align: center; font-size: 14px; color: var(--gold); text-shadow: 3px 3px 0 #000; letter-spacing: 1px; }
        #banner.banner-anim { animation: bannerIn 2.6s ease-out forwards; }
        @keyframes bannerIn { 0% { opacity: 0; transform: scale(0.7); } 12% { opacity: 1; transform: scale(1.05); } 20% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }

        #vignette { position: absolute; inset: 0; }
        #vignette.hit { animation: dmg 0.45s ease-out; }
        @keyframes dmg { 0% { box-shadow: inset 0 0 140px 50px rgba(190, 20, 20, 0.85); } 100% { box-shadow: inset 0 0 140px 50px rgba(190, 20, 20, 0); } }

        /* modal */
        #modal { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(4, 2, 1, 0.78); pointer-events: auto; }
        .hidden { display: none !important; }

        .panel { background: var(--panel); border: 4px solid var(--gold-dark); box-shadow: 0 0 0 4px #000, 0 12px 40px rgba(0,0,0,0.8); padding: 26px 30px; text-align: center; max-width: 760px; }
        .panel h1 { color: var(--gold); font-size: 26px; margin: 0 0 6px; text-shadow: 3px 3px 0 #000; letter-spacing: 2px; }
        .panel h2 { color: #e2622b; font-size: 13px; margin: 0 0 14px; }
        .panel h2.gold { color: var(--gold); font-size: 15px; }
        .panel .sub { color: #9a8c6a; font-size: 8px; margin: 4px 0 16px; line-height: 1.8; }
        .controls { font-size: 8px; color: #cdbf9a; line-height: 2.2; margin-bottom: 18px; }
        .big { font-family: inherit; font-size: 11px; color: #1a1005; background: var(--gold); border: 3px solid #000; padding: 12px 22px; cursor: pointer; box-shadow: 0 4px 0 #000; margin: 4px; }
        .big:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #000; }
        .big:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
        .big.ghost { background: #3a2a1a; color: var(--gold); }
        h1.red { color: var(--blood); }

        .cards { display: flex; gap: 14px; justify-content: center; }
        .card { font-family: inherit; width: 190px; background: #1c150e; color: #e8dcc0; border: 3px solid #3a2a1a; box-shadow: 0 4px 0 #000; padding: 14px 10px 12px; cursor: pointer; text-align: center; position: relative; }
        .card:hover { border-color: var(--gold); transform: translateY(-4px); }
        .card .key { position: absolute; top: 6px; left: 6px; font-size: 8px; color: var(--gold); border: 2px solid var(--gold-dark); padding: 3px 5px; }
        .card .icon { width: 64px; height: 64px; image-rendering: pixelated; margin: 8px 0; }
        .card h3 { font-size: 8px; color: var(--gold); margin: 6px 0 8px; line-height: 1.6; }
        .card h3 .new { color: var(--warp); font-style: normal; font-size: 7px; }
        .card p { font-size: 7px; color: #cdbf9a; line-height: 1.8; margin: 0 0 10px; }
        .pips i { display: inline-block; width: 10px; height: 10px; margin: 0 2px; background: #3a2a1a; border: 2px solid #000; }
        .pips i.on { background: var(--warp); }

        .stats-grid { display: flex; gap: 26px; justify-content: center; margin: 10px 0 18px; }
        .stats-grid span { display: block; font-size: 7px; color: #9a8c6a; margin-bottom: 8px; }
        .stats-grid b { font-size: 14px; color: var(--gold); }

        /* sprite sheet debug page */
        .sheet { padding: 20px; background: #241b13; min-height: 100vh; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
        .sheet-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; background: #1a130d; border: 2px solid #3a3126; padding: 8px; }
        .sheet-cell span { font-family: monospace; font-size: 10px; color: #cdbf9a; }
        .sheet h2 { width: 100%; font-size: 10px; color: var(--gold); }
    </style>
</head>
<body>
    <canvas id="app"></canvas>
    <div id="ui">
        <div id="xpbar"><div id="xpfill"></div></div>
        <div id="topline">
            <span id="lvl">LV 1</span>
            <span id="timer">00:00</span>
            <span id="kills">0 DEAD</span>
        </div>
        <div id="banner" class="hidden"></div>
        <div id="vignette"></div>
        <div id="stats"></div>
        <div id="hpwrap">
            <div id="hpbar"><div id="hpfill"></div></div>
            <div id="hptext">100/100</div>
        </div>
        <div id="modal" class="hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
</body>
</html>
